<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ENJ - Social Media Platform</title>
    <meta name="description" content="Connect, share, and explore on ENJ - modern social media platform." />
    <meta property="og:title" content="ENJ - Social Media Platform" />
    <meta property="og:description" content="Connect, share, and explore on ENJ - modern social media platform." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      /*
       * Theme boot script - must match ThemeContext (storage key + logic).
       * Resolves the stored preference into a concrete class before first
       * paint so the page never flashes the wrong theme.
       */
      (function() {
        try {
          var KEY = 'enj_theme_mode_v3';
          var saved = localStorage.getItem(KEY);
          var mode = saved === 'light' || saved === 'dark' || saved === 'system' ? saved : 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(resolved);
          root.setAttribute('data-theme', resolved);
          root.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-[#FF3366] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
